Ai bordi diventa pigro: lì devi tirare di più.",velocita:"Lento e prevedibile. Perfetto per i bambini e per il primo volo.",debole:"Con vento debole cammina all’indietro mentre tiri a scatti corti. Usa un filo più corto e un aquilone più leggero.",forte:"Con vento forte allunga il filo e lascia che salga da solo. Non lottare: se tira troppo, abbassalo verso il bordo.",errori:"Tirare senza mollare mai. L’aquilone si siede, perde velocità e cade."},{id:"delta",emoji:"\uD83D\uDEE9️",name:"Aquilone Delta",fili:"1 filo",diff:"Facile • Stabile",tag:"Stabile anche con vento ballerino",desc:"Ala a triangolo con la chiglia lunga. Resta su da solo, non si scompone con le raffiche e vola con pochissimo vento.",mani:"Come il Diamante: una mano sul rocchetto. Con il Delta puoi tenere il filo anche con due dita quando il vento è costante.",lancio:"Stesso lancio del Diamante, ma è ancora più semplice: spesso basta tenerlo in mano, sentire il vento e lasciarlo andare mentre fai 3 passi indietro.",guida:"Comandi dolcissimi. Un tirata leggera = virata ampia. Se vuoi farlo planare, molla 1 metro di filo e lascialo scivolare.",atterraggio:"Scendi in diagonale verso il bordo, poi molla piano. Il Delta ama atterrare dolcemente: non tirarlo giù di forza.",movimenti:"TIRA LEGGERO = vira • MOLLA = plana • TIRA DECISO = sale veloce",finestra:"Ama il centro della finestra. Ai bordi resta fermo in aria quasi da solo: ottimo per riposare le braccia.",velocita:"Medio-lento, molto stabile. Non fa scatti improvvisi.",debole:"Il suo superpotere. Con vento debole vola dove il Diamante fatica: tieni il filo corto e cammina all’indietro.",forte:"Con vento forte non tirarlo verso di te: portalo ai bordi e lascialo sfogare. Se vibra troppo, atterra.",errori:"Comandi troppo bruschi. Il Delta risponde già a un dito: se strappi, fa virate enormi."},{id:"parafoil",emoji:"\uD83E\uDE82",name:"Parafoil / Parapendio",fili:"1 filo • Senza struttura",diff:"Medio",tag:"Si gonfia d’aria, zero stecche da rompere",desc:"Niente stecche: è una vela con celle che si gonfiano. Si piega in tasca, non si rompe e tira con forza sorprendente.",mani:"Due mani sul rocchetto o sulle maniglie se ha le briglie. Tieni le braccia davanti al petto, pronte a mollare.",lancio:"Stendilo a terra con le aperture verso il vento. Allontanati tenendo le briglie tese, poi tira deciso: le celle si gonfiano e lui decolla da solo. Se una cella resta sgonfia, scuoti il filo.",guida:"Tira per dare potenza, molla per far sgonfiare e perdere quota. Le virate si fanno tirando di più da un lato: lui gira da solo, senza bisogno di strappi.",atterraggio:"Portalo al bordo, molla e fallo scendere. Appena tocca terra, cammina verso di lui tenendo il filo molle: se tiri, si rigonfia e riparte.",movimenti:"TIRA = potenza • MOLLA = sgonfia e scende • TIRA DA UN LATO = vira",finestra:"Vive nella zona di potenza. Al centro tira di più: lì devi essere pronto a mollare o a fare un passo avanti.",velocita:"Medio, con accelerazioni improvvise quando si gonfia.",debole:"Serve vento pulito. Stendi bene le celle, non lanciare con vento a raffiche: aspetta la raffica buona.",forte:"Tira tantissimo. Usa un filo corto, resta al bordo e non stare mai al centro con vento forte se sei principiante.",errori:"Lasciarlo cadere di punta: le celle si chiudono e si aggroviglia. Atterra sempre in piano."},{id:"stunt",emoji:"\uD83C\uDFAF",name:"Acrobatico 2 fili",fili:"2 fili",diff:"Intermedio • Stunt",tag:"Loop, figure 8 e virate fulminee",desc:"Due fili, due mani, controllo totale. È l’aquilone che disegna nel cielo: loop, otto, virate secche e volo all’indietro.",mani:"Una maniglia per mano. Pollici verso l’alto, gomiti morbidi, mani all’altezza del petto. La mano destra comanda il lato destro, la sinistra il sinistro.",lancio:"Appoggialo a pancia in giù, naso verso il vento. Tendi i fili camminando indietro, poi tira entrambi insieme con decisione: decolla in verticale.",guida:"Tira la mano destra = gira a destra. Tira la sinistra = gira a sinistra. Tira entrambe = sale. Molla entrambe = scende. Per il loop: tira una mano sola e tienila finché non chiude il cerchio.",atterraggio:"Portalo al bordo della finestra, ruotalo con il naso in giù e fallo scendere piano. A terra, molla subito i fili o lui riparte.",movimenti:"TIRA DESTRA = gira a destra • TIRA SINISTRA = gira a sinistra • TIRA ENTRAMBE = sale • MOLLA = scende",finestra:"Usa tutta la finestra. Al centro è velocissimo e potente, ai bordi diventa lento e facile da controllare.",velocita:"Veloce! Al centro può superare i 60 km/h. Inizia sempre dai bordi.",debole:"Vola ma è pigro: tieni i fili corti (15-20 m) e dai comandi più decisi. Cammina indietro per aiutarlo.",forte:"Riduci la lunghezza dei fili e resta ai bordi. Se è troppo veloce, fallo salire in alto al centro e lascialo respirare.",errori:"Tirare entrambe le mani in panico. L’aquilone accelera e si schianta. Con il panico: molla una mano e lui si ferma."},{id:"revolution",emoji:"\uD83D\uDC8E",name:"4 fili Revolution",fili:"4 fili",diff:"Avanzato • Precisione",tag:"Si ferma in aria, vola all’indietro e di lato",desc:"Quattro fili, due maniglie. È l’aquilone dei professionisti: si ferma immobile in aria, vola di lato e all’indietro come un elicottero.",mani:"Maniglie con due fili sopra e due sotto. Mani alla stessa altezza, polsi sciolti. Il segreto è nei polsi, non nelle braccia.",lancio:"Mettilo in piedi sul bordo d’attacco, naso in alto. Tira i fili superiori e lui si alza da solo, come se lo sollevassi con le mani.",guida:"Polso indietro = sale. Polso avanti = scende e va all’indietro. Polso destro = gira a destra. Per fermarlo: riporta i polsi in posizione neutra e lui si blocca in aria.",atterraggio:"Portalo al bordo, ruota i polsi per metterlo a pancia in giù e fallo scendere. Tocca terra dolcemente: il Revolution atterra come un gatto.",movimenti:"POLSO INDIETRO = sale • POLSO AVANTI = indietro • RUOTA POLSO = gira • POLSI NEUTRI = stop in aria",finestra:"Può volare in tutta la finestra e anche fuori. La sua zona migliore è il centro-alto, dove fa le figure più pulite.",velocita:"Da zero a veloce, a comando tuo. Puoi farlo volare lentissimo o scattare: è questo che lo rende magico.",debole:"Il migliore con vento debole: con i polsi puoi tenerlo su anche con una brezza leggera.",forte:"Con vento forte è potentissimo: usa movimenti di polso piccolissimi. Un centimetro basta.",errori:"Muovere le braccia invece dei polsi. Con le braccia fai movimenti enormi e imprecisi: pensa ai polsi."},{id:"power",emoji:"\uD83D\uDCAA",name:"Power Kite / Trazione",fili:"2 o 4 fili",diff:"Avanzato • Potente",tag:"Ti trascina: per buggy, snowkite e kitesurf",desc:"Un’ala che tira come un piccolo motore. Serve per farti trainare su terra, neve o acqua. Potenza vera: si impara con rispetto e con casco.",mani:"Barra o maniglie con entrambe le mani, braccia tese in avanti. Indossa sempre casco e imbracatura: mai tenere la barra con una mano sola.",lancio:"Con l’aiutante: ala a terra a bordo finestra, tu pronto al centro. Segnale chiaro, poi tira la barra: l’ala si gonfia e sale al bordo.",guida:"Barra verso di te = più potenza. Barra lontana = meno potenza. Gira la barra per virare. Mai tenere la barra tirata al massimo in raffica.",atterraggio:"Porta l’ala al bordo della finestra e falla scendere. Un aiutante la prende, oppure falla cadere a pancia in giù e cammina verso di lei con la barra molle.",movimenti:"BARRA A TE = potenza • BARRA LONTANO = depower • GIRA BARRA = vira • MOLLA = si sgonfia",finestra:"La zona di potenza è al centro e in basso. È lì che tira di più: i principianti stanno sempre ai bordi.",velocita:"Potentissimo. Può sollevarti: non usarlo mai con vento forte se non sei seguito da un istruttore.",debole:"Con vento debole si impara: è il momento perfetto per fare pratica senza paura.",forte:"NON volare da solo con vento forte. Usa un’ala più piccola, un aiutante e uno spazio enorme e libero.",errori:"Tenere la barra tirata in raffica. La potenza raddoppia in un secondo: molla subito la barra verso l’esterno."}],Jl=[{id:1,title:"Livello 1 • Principiante",color:"#FFD600",items:[{id:"l1-1",label:"Lancio da solo senza aiuto",desc:"Aquilone a terra, vento alle spalle, decollo pulito."},{id:"l1-2",label:"Tenerlo in aria 5 minuti",desc:"Senza farlo cadere, usando tira e molla."},{id:"l1-3",label:"Atterraggio dolce",desc:"Scendere in diagonale e posarlo senza schianto."}]},{id:2,title:"Livello 2 • Intermedio",color:"#FF9E00",items:[{id:"l2-1",label:"Figura 8 perfetta",desc:"Due cerchi uguali, uno a destra e uno a sinistra."},{id:"l2-2",label:"Loop controllato",desc:"Cerchio completo senza perdere quota."},{id:"l2-3",label:"Virata secca",desc:"Cambio di direzione a 90° senza sbandare."},{id:"l2-4",label:"Volo in formazione",desc:"Volare vicino a un altro aquilone senza incrociare i fili."}]},{id:3,title:"Livello 3 • Pro",color:"#FF6D00",items:[{id:"l3-1",label:"Stall: fermo in aria",desc:"L’aquilone si ferma e resta appeso al vento."},{id:"l3-2",label:"Axel",desc:"Giro su se stesso con i fili che si incrociano e si sciolgono."},{id:"l3-3",label:"Fade: volo all’indietro",desc:"Scendere all’indietro senza cadere."},{id:"l3-4",label:"360°",desc:"Giro completo intorno a te tenendo il controllo."},{id:"l3-5",label:"Volo in team",desc:"Figure sincronizzate con altri piloti."}]}],xa=Jl.flatMap((e)=>e.items),Na=[{id:"decollo",label:"Decollo",emoji:"\uD83D\uDE80",steps:["Controlla lo spazio: 50 m liberi, niente alberi, fili o persone.","Mettiti con il vento alle spalle e senti da dove arriva.","Stendi i fili senza nodi e senza incroci.","Aquilone a terra, naso verso il vento, fili tesi.","Segnale all’aiutante o 3 passi indietro se sei da solo.","Tira deciso e lascia salire: non correre, il vento fa il lavoro."],pro:"Il trucco del pro: aspetta la raffica buona. Un lancio con la raffica giusta vale 10 tentativi affrettati."},{id:"aria",label:"Tenere in aria",emoji:"☁️",steps:["Guarda sempre l’aquilone, mai il rocchetto.","Tira poco e spesso, mai un tiro lungo.","Se scende, tira a scatti e fai 2 passi indietro.","Se sale troppo in fretta, molla 1 metro di filo.","Ai bordi è lento: è lì che recuperi il fiato.","Se il vento cala, muoviti: cammina indietro per creare vento."],pro:"Trucco del pro: le braccia fanno da ammortizzatore. Braccia morbide = aquilone stabile."},{id:"virare",label:"Virare",emoji:"↩️",steps:["Decidi dove vuoi andare prima di tirare.","Tira dal lato della virata, l’altra mano ferma.","Guarda la punta dell’aquilone: lì va il tuo sguardo.","Quando ha girato, rimetti le mani pari.","Se vira troppo, molla e lascialo stabilizzare.","Allena virate larghe, poi stringile piano piano."],pro:"Trucco del pro: vira con un solo movimento deciso, non con tanti strappetti. È più pulito e più veloce."},{id:"loop",label:"Loop",emoji:"\uD83C\uDF00",steps:["Porta l’aquilone in alto al centro, con velocità.","Tira una mano sola e tienila ferma.","Lascia chiudere il cerchio senza mollare.","A metà loop, preparati: è il punto più veloce.","Quando chiude, rimetti le mani pari.","Inizia con loop grandi, poi falli più piccoli."],pro:"Trucco del pro: il primo loop fallo sempre in alto e con spazio. In basso non perdona."},{id:"atterraggio",label:"Atterraggio",emoji:"\uD83D\uDEEC",steps:["Avvisa chi è vicino: “Atterro!”.","Porta l’aquilone al bordo della finestra.","Scendi in diagonale, mai in verticale.","A 2 metri da terra, rallenta con il filo.","Appoggialo dolcemente, naso verso il vento.","Molla il filo e cammina verso di lui."],pro:"Trucco del pro: un buon atterraggio si prepara a 20 metri da terra, non all’ultimo secondo."},{id:"emergenza",label:"Recupero di emergenza",emoji:"\uD83C\uDD98",steps:["Se va verso le persone: urla “Attenzione!” e molla il filo.","Se va verso un albero: portalo al bordo e fallo scendere.","Se si aggroviglia in aria: non tirare, molla e lascia che cada in piano.","Se il vento diventa tempesta: atterra subito, non aspettare.","Se il filo si rompe: resta fermo, avvisa gli altri, recupera l’aquilone.","Se qualcuno è in pericolo: lascia andare tutto. Un aquilone si ricompra, le persone no."],pro:"Trucco del pro: la mossa d’emergenza va provata con vento leggero. In emergenza non si improvvisa."},{id:"fili",label:"Sbrogliare i fili",emoji:"\uD83E\uDDF6",steps:["Non tirare mai un groviglio: si stringe.","Metti l’aquilone a terra e molla tutta la tensione.","Trova il punto dove i fili si incrociano.","Segui un filo alla volta, dall’aquilone alla mano.","Ruota l’aquilone per sciogliere, non le mani.","Se è un nodo vero, aprilo con le dita, mai con i denti."],pro:"Trucco del pro: avvolgi sempre i fili con calma dopo il volo. 2 minuti di ordine = 0 minuti di grovigli."}],Gm=[{t:"Tirare troppo, sempre",why:"L’aquilone si siede, perde velocità e cade come un sasso. Più tiri, più va giù.",fix:"Tira e molla. Il volo è un ritmo, non una gara di forza."},{t:"Volare con i fili aggrovigliati",why:"I comandi arrivano storti: l’aquilone gira da solo e può schiantarsi.",fix:"Prima di volare, stendi i fili e controlla che siano paralleli."},{t:"Stare sottovento a un altro pilota",why:"I suoi fili possono tagliarti la strada e gli aquiloni si scontrano.",fix:"Stai sempre a 30 metri di lato, mai dietro un altro aquilone."},{t:"Volare vicino a fili elettrici",why:"Il filo bagnato conduce elettricità. È il pericolo più grave di tutti.",fix:"Mai, mai vicino a tralicci, cavi o cabine. Cambia campo."},{t:"Non controllare i nodi",why:"Un nodo lento si scioglie in volo: l’aquilone parte da solo e non lo fermi più.",fix:"Tira ogni nodo prima del decollo. Se è sfilacciato, rifallo."},{t:"Volare sopra le persone",why:"Se cade, un aquilone da 300 grammi a 60 km/h fa male davvero.",fix:"Vola sempre sottovento alle persone, con 50 metri liberi davanti."},{t:"Usare un aquilone troppo potente",why:"La raffica ti trascina, cadi e non riesci a mollare in tempo.",fix:"Inizia piccolo. La potenza si conquista, non si improvvisa."},{t:"Non guardare il cielo",why:"Un a
